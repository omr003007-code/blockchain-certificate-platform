<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniCert - Blockchain Certificate System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: none; }
        .navbar { background-color: #0d6efd !important; }
        #dashboard-section { display: none; }
    </style>
</head>
<body>

<nav class="navbar navbar-dark mb-4">
    <div class="container">
        <a class="navbar-brand fw-bold" href="#">🎓 UniCert Blockchain System</a>
    </div>
</nav>

<div class="container">
    <ul class="nav nav-tabs mb-3" id="mainTabs" role="tablist">
        <li class="nav-item"><button class="nav-link active" data-bs-toggle="tab" data-bs-target="#verify-tab">Public Verification</button></li>
        <li class="nav-item"><button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin-tab">Admin Portal</button></li>
    </ul>

    <div class="tab-content">
        <!-- PUBLIC VERIFICATION TAB -->
        <div class="tab-pane fade show active" id="verify-tab">
            <div class="card p-4">
                <h3>Verify a Certificate</h3>
                <p class="text-muted">Enter the Certificate ID to check its status on the blockchain.</p>
                <div class="input-group mb-3">
                    <input type="text" id="verify-input" class="form-control" placeholder="e.g., CERT-1791134921595-813">
                    <button class="btn btn-primary" onclick="verifyCert()">Verify</button>
                </div>
                <div id="verify-result" class="mt-3"></div>
            </div>
        </div>

        <!-- ADMIN PORTAL TAB -->
        <div class="tab-pane fade" id="admin-tab">
            <!-- Login Section -->
            <div class="card p-4" id="login-section">
                <h3>Admin Login</h3>
                <div class="mb-3"><input type="email" id="login-email" class="form-control" placeholder="Email" value="admin@university.com"></div>
                <div class="mb-3"><input type="password" id="login-pass" class="form-control" placeholder="Password" value="password123"></div>
                <button class="btn btn-success w-100" onclick="login()">Login</button>
                <div id="login-error" class="text-danger mt-2"></div>
            </div>

            <!-- Dashboard Section (Hidden until logged in) -->
            <div class="card p-4" id="dashboard-section">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3>Issue New Certificate</h3>
                    <button class="btn btn-outline-danger btn-sm" onclick="logout()">Logout</button>
                </div>
                <div class="row g-3">
                    <div class="col-md-6"><input type="text" id="issue-name" class="form-control" placeholder="Recipient Name"></div>
                    <div class="col-md-6"><input type="email" id="issue-email" class="form-control" placeholder="Recipient Email"></div>
                    <div class="col-md-6"><input type="text" id="issue-course" class="form-control" placeholder="Course Name"></div>
                    <div class="col-md-6"><input type="date" id="issue-date" class="form-control"></div>
                </div>
                <button class="btn btn-primary w-100 mt-3" onclick="issueCert()">Issue Certificate</button>
                <div id="issue-result" class="mt-3"></div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const API_URL = ''; // Same origin

    // --- AUTHENTICATION ---
    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-pass').value;
        try {
            const res = await fetch(`${API_URL}/api/auth/login`, {
                method: 'POST', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email, password })
            });
            const data = await res.json();
            if (data.token) {
                localStorage.setItem('token', data.token);
                document.getElementById('login-section').style.display = 'none';
                document.getElementById('dashboard-section').style.display = 'block';
                document.getElementById('login-error').innerText = '';
            } else {
                document.getElementById('login-error').innerText = data.message || 'Login failed';
            }
        } catch (err) { console.error(err); }
    }

    function logout() {
        localStorage.removeItem('token');
        document.getElementById('login-section').style.display = 'block';
        document.getElementById('dashboard-section').style.display = 'none';
    }

    // Check if already logged in on page load
    if (localStorage.getItem('token')) {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('dashboard-section').style.display = 'block';
    }

    // --- ISSUE CERTIFICATE ---
    async function issueCert() {
        const token = localStorage.getItem('token');
        const body = {
            recipientName: document.getElementById('issue-name').value,
            recipientEmail: document.getElementById('issue-email').value,
            courseName: document.getElementById('issue-course').value,
            expirationDate: document.getElementById('issue-date').value
        };

        const res = await fetch(`${API_URL}/api/certificates/issue`, {
            method: 'POST', headers: {'Content-Type': 'application/json', 'Authorization': `Bearer ${token}`},
            body: JSON.stringify(body)
        });
        const data = await res.json();
        
        const resultDiv = document.getElementById('issue-result');
        if (data.certificateId) {
            resultDiv.innerHTML = `<div class="alert alert-success">
                <strong>Success!</strong> Certificate ID: <b>${data.certificateId}</b><br>
                Blockchain TX: <small>${data.txHash}</small><br>
                <a href="${data.pdfUrl}" target="_blank" class="btn btn-sm btn-dark mt-2">Download PDF</a>
            </div>`;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger">Error: ${data.error || 'Failed'}</div>`;
        }
    }

    // --- VERIFY CERTIFICATE ---
    async function verifyCert() {
        const certId = document.getElementById('verify-input').value.trim();
        if (!certId) return;

        const res = await fetch(`${API_URL}/api/certificates/verify/${certId}`);
        const data = await res.json();
        
        const resultDiv = document.getElementById('verify-result');
        if (data.status === 'Valid') {
            resultDiv.innerHTML = `<div class="alert alert-success">
                <h4>✅ ${data.status}</h4>
                <p><b>Recipient:</b> ${data.recipientName}</p>
                <p><b>Course:</b> ${data.courseName}</p>
                <p><b>Issued:</b> ${data.issueDate} | <b>Expires:</b> ${data.expirationDate}</p>
                <p><b>Blockchain Proof:</b> <small>${data.blockchainProof}</small></p>
            </div>`;
        } else {
            resultDiv.innerHTML = `<div class="alert alert-danger"><h4>❌ ${data.status}</h4><p>${data.message}</p></div>`;
        }
    }
</script>
</body>
</html>
